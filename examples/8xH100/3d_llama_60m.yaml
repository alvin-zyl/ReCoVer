# 3D-parallel training of Llama 60M on 8 GPUs with Nanotron: DP=2, TP=2, PP=2.
# A Nanotron config, used by 3d_llama_60m.sh. The dataset is the container's /data/c4/tokenized/seq_len_4096.
checkpoints:
  checkpoint_interval: 10000
  checkpoints_path: checkpoints
  checkpoints_path_is_shared_file_system: true
  resume_checkpoint_path: null
  save_final_state: false
  save_initial_state: false
data_stages:
- data:
    dataset:
      dataset_overwrite_cache: false
      hf_dataset_or_datasets: /data/c4/tokenized/seq_len_4096
      hf_dataset_splits: train
      load_from_disk: true
      text_column_name: text
    num_loading_workers: 1
    seed: 42
  name: Stable Training Stage
  start_training_step: 1
general:
  benchmark_csv_path: null
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: recover
  run: 3d_llama_60m
  seed: 42
  step: null
lighteval: null
logging:
  iteration_step_info_interval: 1
  log_level: info
  log_level_replica: info
model:
  ddp_bucket_cap_mb: 5
  dtype: bfloat16
  init_method:
    std: 0.025
  make_vocab_size_divisible_by: 1
  model_config:
    bos_token_id: 1
    eos_token_id: 2
    hidden_act: silu
    hidden_size: 512
    initializer_range: 0.02
    intermediate_size: 1344
    is_llama_config: true
    max_position_embeddings: 4096
    num_attention_heads: 8
    num_hidden_layers: 8
    num_key_value_heads: 8
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    tie_word_embeddings: false
    use_cache: true
    vocab_size: 32000
optimizer:
  accumulate_grad_in_fp32: true
  clip_grad: 0.5
  learning_rate_scheduler:
    learning_rate: 0.001
    lr_decay_starting_step: null
    lr_decay_style: cosine
    lr_warmup_steps: 200
    lr_warmup_style: linear
    min_decay_lr: 1.0e-05
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.01
  zero_stage: 0
parallelism:
  dp: 2
  expert_parallel_size: 1
  pp: 2
  pp_engine: 1f1b
  tp: 2
  tp_linear_async_communication: false
  tp_mode: ALL_REDUCE
profiler: null
tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: meta-llama/Llama-2-7b
  tokenizer_revision: null
tokens:
  batch_accumulation_per_replica: 4
  limit_test_batches: 0
  limit_val_batches: 2
  micro_batch_size: 1
  sequence_length: 4096
  train_steps: 100
  val_check_interval: 10
